<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICHAR Casework</title>
<meta name="description" content="Internal case management for ICHAR. Staff access only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05065d">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Sign in -->
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <div class="gate-head">
      <b>ICHAR Casework</b>
      <span>Staff access. Every action on a file is recorded against your name.</span>
    </div>
    <form class="gate-body" id="signin-form">
      <div class="field">
        <label class="label" for="gate-email">Work email</label>
        <input id="gate-email" type="email" autocomplete="username" required>
      </div>
      <div class="field" id="gate-pass-wrap">
        <label class="label" for="gate-pass">Password</label>
        <input id="gate-pass" type="password" autocomplete="current-password">
      </div>
      <p class="gate-err" id="gate-err" hidden></p>
      <button class="btn block" type="submit" id="gate-btn">Sign in</button>
      <button class="btn ghost block" type="button" id="gate-reset">Email me a reset link</button>
      <p class="small muted" style="margin:0" id="gate-note"></p>
    </form>
  </div>
</div>

<!-- Application -->
<div class="shell" id="shell" hidden>
  <nav class="rail" id="rail" aria-label="Sections">
    <div class="rail-head">
      <div class="rail-mark">
        <span class="glyph">IC</span>
        <span>
          <b>ICHAR Casework</b>
          <span>Council record</span>
        </span>
      </div>
    </div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-foot">
      <div class="rail-who" id="rail-who"></div>
      <button type="button" id="signout">Sign out</button>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <button class="btn ghost sm railtoggle" id="railtoggle" aria-label="Open navigation">Menu</button>
      <div class="grow">
        <h1 id="page-title">Overview</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div id="page-actions" style="display:flex;gap:10px;flex-wrap:wrap"></div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
